<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구구단 두더지 잡기 Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Jua Font for cute Arcade/Korean style -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* Grass Ground Texture Pattern */
        .game-board {
            background-color: #81c784;
            background-image: radial-gradient(#66bb6a 20%, transparent 20%),
                              radial-gradient(#4caf50 20%, transparent 20%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        /* Hole style */
        .hole {
            position: relative;
            overflow: hidden;
            border-radius: 50%;
            background: linear-gradient(180deg, #3e2723 0%, #4e342e 70%, #5d4037 100%);
            box-shadow: inset 0 10px 15px rgba(0,0,0,0.6), 0 5px 0 rgba(255,255,255,0.2);
        }

        .hole::after {
            content: '';
            position: absolute;
            bottom: -5%;
            left: -5%;
            right: -5%;
            height: 35%;
            background: #2e1c14;
            border-radius: 50%;
            z-index: 10;
        }

        /* Mole Container & Animation */
        .mole-container {
            position: absolute;
            left: 0;
            right: 0;
            bottom: -110%;
            height: 100%;
            transition: bottom 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        .mole-container.up {
            bottom: 5%;
        }

        .mole-container.hit {
            animation: moleHit 0.2s ease-in-out;
        }

        @keyframes moleHit {
            0% { transform: scale(1); }
            50% { transform: scale(0.8) rotate(-10deg); }
            100% { transform: scale(1); }
        }

        /* Custom Hammer Cursor Effect */
        .hammer-cursor {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 24 24' fill='%23ff9800'><path d='M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z'/></svg>"), auto;
        }

        /* Floating text animation */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            50% { transform: translateY(-30px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-60px) scale(1); }
        }

        .animate-pop-text {
            animation: floatUp 0.8s ease-out forwards;
        }

        /* Pulse / Shake effects */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .shake-screen {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen flex items-center justify-center p-2 sm:p-4 select-none">

    <!-- Main Outer Container -->
    <div id="app" class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl border-4 border-amber-300 overflow-hidden relative">

        <!-- Header / Title Banner -->
        <header class="bg-amber-400 p-3 sm:p-4 text-center border-b-4 border-amber-500 flex justify-between items-center px-6">
            <h1 class="text-2xl sm:text-3xl text-amber-950 tracking-wider flex items-center gap-2 drop-shadow-sm">
                <i class="fa-solid font-bold text-amber-800 fa-hammer"></i> 구구단 두더지 잡기
            </h1>
            <button id="soundToggleBtn" onclick="toggleSound()" class="bg-amber-200 hover:bg-amber-300 text-amber-900 rounded-full w-10 h-10 flex items-center justify-center border-2 border-amber-500 transition-all">
                <i id="soundIcon" class="fa-solid fa-volume-high text-lg"></i>
            </button>
        </header>

        <!-- Dynamic Screen Content Area -->
        <main class="p-4 sm:p-6 min-h-[500px] flex flex-col justify-center items-center relative">

            <!-- 1. Start Screen -->
            <div id="startScreen" class="w-full flex flex-col items-center gap-6 py-4">
                <div class="text-center">
                    <p class="text-amber-800 text-lg mb-1">신나게 망치를 두드리며 구구단을 외워봐요!</p>
                    <span class="inline-block bg-amber-100 text-amber-800 text-xs px-3 py-1 rounded-full border border-amber-300">정답 숫자를 가진 두더지를 콕! 잡으세요.</span>
                </div>

                <!-- Settings Box -->
                <div class="w-full bg-amber-50 p-4 sm:p-5 rounded-2xl border-2 border-amber-200 space-y-4">
                    <!-- Table Select -->
                    <div>
                        <label class="block text-amber-900 text-lg mb-2 text-center font-bold">
                            <i class="fa-solid fa-calculator text-amber-600 mr-1"></i> 구구단 단수 선택
                        </label>
                        <div id="danButtons" class="grid grid-cols-5 gap-2">
                            <!-- JS generates buttons (2~9 and Random) -->
                        </div>
                    </div>

                    <!-- Difficulty Select -->
                    <div>
                        <label class="block text-amber-900 text-lg mb-2 text-center font-bold">
                            <i class="fa-solid fa-gauge-high text-amber-600 mr-1"></i> 난이도 선택
                        </label>
                        <div class="grid grid-cols-3 gap-3">
                            <button onclick="setDifficulty('easy')" id="diff-easy" class="diff-btn py-2.5 rounded-xl border-2 font-bold transition-all bg-white border-slate-200 text-slate-600 hover:bg-emerald-50">
                                쉬움 (천천히)
                            </button>
                            <button onclick="setDifficulty('medium')" id="diff-medium" class="diff-btn py-2.5 rounded-xl border-2 font-bold transition-all bg-emerald-500 border-emerald-600 text-white shadow-md">
                                보통 (추천)
                            </button>
                            <button onclick="setDifficulty('hard')" id="diff-hard" class="diff-btn py-2.5 rounded-xl border-2 font-bold transition-all bg-white border-slate-200 text-slate-600 hover:bg-rose-50">
                                어려움 (빠름!)
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Start Button -->
                <button onclick="startGame()" class="w-full py-4 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white text-2xl font-bold rounded-2xl shadow-lg border-b-4 border-orange-700 active:translate-y-1 active:border-b-0 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> 게임 시작하기!
                </button>
            </div>

            <!-- 2. Gameplay Screen (Hidden by default) -->
            <div id="gameScreen" class="w-full flex-col items-center gap-4 hidden">
                <!-- Top HUD Bar -->
                <div class="w-full flex justify-between items-center bg-amber-100 p-3 rounded-2xl border-2 border-amber-300 text-lg">
                    <!-- Timer -->
                    <div class="flex items-center gap-2 text-rose-600 font-bold min-w-[100px]">
                        <i class="fa-solid fa-clock text-xl"></i>
                        <span id="timerText" class="text-2xl">45s</span>
                    </div>

                    <!-- Combo display -->
                    <div class="flex items-center gap-1 text-amber-700 font-bold">
                        <span class="text-sm">COMBO</span>
                        <span id="comboText" class="text-2xl text-orange-600">0</span>
                    </div>

                    <!-- Score -->
                    <div class="flex items-center gap-2 text-blue-700 font-bold min-w-[100px] justify-end">
                        <i class="fa-solid fa-star text-amber-500 text-xl"></i>
                        <span id="scoreText" class="text-2xl">0점</span>
                    </div>
                </div>

                <!-- Problem Banner -->
                <div class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white py-3 px-6 rounded-2xl shadow-md border-b-4 border-indigo-800 text-center flex justify-center items-center gap-4">
                    <span class="text-xl sm:text-2xl font-bold opacity-90">문제:</span>
                    <span id="problemText" class="text-3xl sm:text-4xl font-extrabold tracking-wider text-yellow-300 animate-pulse">7 × 8 = ?</span>
                </div>

                <!-- Mole Grid (3x3 = 9 Holes) -->
                <div id="moleGrid" class="game-board w-full aspect-square sm:aspect-[4/3] rounded-3xl p-4 sm:p-6 grid grid-cols-3 gap-3 sm:gap-5 shadow-inner border-4 border-green-700 relative overflow-hidden cursor-crosshair">
                    <!-- 9 Holes will be dynamic inside HTML or preset -->
                </div>
            </div>

            <!-- 3. Game Over Screen (Hidden by default) -->
            <div id="gameOverScreen" class="w-full flex-col items-center gap-5 py-4 hidden">
                <div class="text-center space-y-1">
                    <div id="resultBadge" class="inline-block px-4 py-1 bg-amber-100 text-amber-800 rounded-full font-bold text-sm mb-2">수고했어요!</div>
                    <h2 class="text-4xl font-extrabold text-amber-900">게임 종료!</h2>
                </div>

                <!-- Result Scoreboard Card -->
                <div class="w-full bg-gradient-to-b from-amber-50 to-orange-50 p-6 rounded-3xl border-4 border-amber-300 space-y-4 text-center shadow-lg">
                    <div>
                        <span class="text-slate-600 text-base">최종 점수</span>
                        <div id="finalScore" class="text-5xl font-extrabold text-amber-600 my-1">0점</div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 pt-3 border-t border-amber-200">
                        <div class="bg-white p-3 rounded-2xl border border-amber-200">
                            <span class="text-slate-500 text-xs block">맞힌 문제</span>
                            <span id="correctCount" class="text-2xl font-bold text-emerald-600">0개</span>
                        </div>
                        <div class="bg-white p-3 rounded-2xl border border-amber-200">
                            <span class="text-slate-500 text-xs block">최대 연속 정답(Combo)</span>
                            <span id="maxCombo" class="text-2xl font-bold text-orange-500">0회</span>
                        </div>
                    </div>
                </div>

                <!-- Restart Button -->
                <button onclick="showStartScreen()" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white text-2xl font-bold rounded-2xl shadow-lg border-b-4 border-teal-800 active:translate-y-1 active:border-b-0 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> 다시 도전하기
                </button>
            </div>

            <!-- Pop-up Floating Overlay Container for Animations -->
            <div id="popOverlay" class="pointer-events-none absolute inset-0 z-50 overflow-hidden"></div>
        </main>
    </div>

    <!-- JavaScript Game Logic -->
    <script>
        /* ================= GAME CONFIG & STATE ================= */
        let selectedDan = 'all'; // 'all' or 2..9
        let selectedDifficulty = 'medium'; // easy, medium, hard
        
        const DIFFICULTY_SETTINGS = {
            easy: { duration: 4.0, moleUpTime: 2200, spawnInterval: 1800, name: '쉬움' },
            medium: { duration: 3.5, moleUpTime: 1700, spawnInterval: 1300, name: '보통' },
            hard: { duration: 3.0, moleUpTime: 1200, spawnInterval: 900, name: '어려움' }
        };

        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let correctAnswersCount = 0;
        let timeLeft = 45; // Total game seconds
        let gameTimer = null;
        let moleTimer = null;
        let isGameRunning = false;
        let soundEnabled = true;

        // Current Problem Object
        let currentProblem = { num1: 2, num2: 1, answer: 2 };

        // Hole / Mole tracking
        const HOLE_COUNT = 9;
        let activeMoles = Array(HOLE_COUNT).fill(null); // stores { value: number, isCorrect: boolean, timeout: id }

        /* ================= AUDIO SYNTHESIS (Web Audio API) ================= */
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                initAudio();
                const now = audioCtx.currentTime;

                if (type === 'hitCorrect') {
                    // Cute Arpeggio sound
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.15); // C6
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'hitWrong') {
                    // Low buzz / bonk sound
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.25);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'pop') {
                    // Mole pop-up sound
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'gameover') {
                    // Fanfare end sound
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.1);
                    osc.frequency.setValueAtTime(659.25, now + 0.2);
                    osc.frequency.setValueAtTime(880, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.6);
                }
            } catch (e) {
                console.log("Audio play error", e);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            const btn = document.getElementById('soundToggleBtn');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-lg';
                btn.classList.remove('opacity-50');
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-lg';
                btn.classList.add('opacity-50');
            }
        }

        /* ================= UI INIT & SELECTION ================= */
        function initDanButtons() {
            const container = document.getElementById('danButtons');
            container.innerHTML = '';

            // Random button
            const randBtn = document.createElement('button');
            randBtn.className = `dan-btn py-2 rounded-xl border-2 font-bold transition-all ${selectedDan === 'all' ? 'bg-amber-500 border-amber-600 text-white shadow-md' : 'bg-white border-slate-200 text-slate-700 hover:bg-amber-100'}`;
            randBtn.innerText = '전체';
            randBtn.onclick = () => selectDan('all');
            container.appendChild(randBtn);

            // 2 to 9 buttons
            for (let d = 2; d <= 9; d++) {
                const btn = document.createElement('button');
                btn.className = `dan-btn py-2 rounded-xl border-2 font-bold transition-all ${selectedDan === d ? 'bg-amber-500 border-amber-600 text-white shadow-md' : 'bg-white border-slate-200 text-slate-700 hover:bg-amber-100'}`;
                btn.innerText = `${d}단`;
                btn.onclick = () => selectDan(d);
                container.appendChild(btn);
            }
        }

        function selectDan(dan) {
            selectedDan = dan;
            initDanButtons();
        }

        function setDifficulty(diff) {
            selectedDifficulty = diff;
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.className = 'diff-btn py-2.5 rounded-xl border-2 font-bold transition-all bg-white border-slate-200 text-slate-600 hover:bg-amber-50';
            });
            const activeBtn = document.getElementById(`diff-${diff}`);
            activeBtn.className = 'diff-btn py-2.5 rounded-xl border-2 font-bold transition-all bg-emerald-500 border-emerald-600 text-white shadow-md';
        }

        function buildMoleGrid() {
            const grid = document.getElementById('moleGrid');
            grid.innerHTML = '';
            for (let i = 0; i < HOLE_COUNT; i++) {
                const hole = document.createElement('div');
                hole.className = 'hole w-full h-full relative cursor-pointer';
                hole.onclick = (e) => whackMole(i, e);

                hole.innerHTML = `
                    <div id="mole-${i}" class="mole-container">
                        <!-- Mole SVG Graphics -->
                        <div class="relative flex flex-col items-center">
                            <!-- Signboard showing number -->
                            <div class="bg-yellow-100 border-2 border-amber-700 text-amber-950 font-extrabold px-3 py-1 rounded-xl shadow-md text-lg sm:text-2xl z-20 -mb-2 min-w-[50px] text-center">
                                <span id="mole-val-${i}">0</span>
                            </div>
                            <!-- Cute Mole Face SVG -->
                            <svg class="w-16 h-16 sm:w-20 sm:h-20 drop-shadow-md" viewBox="0 0 100 100">
                                <!-- Body -->
                                <path d="M 20 80 C 20 20, 80 20, 80 80 Z" fill="#795548" />
                                <!-- Cheeks -->
                                <circle cx="32" cy="55" r="7" fill="#ffab91" opacity="0.8" />
                                <circle cx="68" cy="55" r="7" fill="#ffab91" opacity="0.8" />
                                <!-- Snout -->
                                <ellipse cx="50" cy="58" rx="16" ry="11" fill="#d7ccc8" />
                                <!-- Nose -->
                                <ellipse cx="50" cy="53" rx="7" ry="5" fill="#3e2723" />
                                <!-- Eyes -->
                                <circle cx="36" cy="45" r="4" fill="#212121" />
                                <circle cx="64" cy="45" r="4" fill="#212121" />
                                <!-- Eye Highlights -->
                                <circle cx="37" cy="44" r="1.5" fill="#ffffff" />
                                <circle cx="65" cy="44" r="1.5" fill="#ffffff" />
                            </svg>
                        </div>
                    </div>
                `;
                grid.appendChild(hole);
            }
        }

        /* ================= GAMEPLAY CORE LOGIC ================= */
        function generateNewProblem() {
            let n1;
            if (selectedDan === 'all') {
                n1 = Math.floor(Math.random() * 8) + 2; // 2..9
            } else {
                n1 = parseInt(selectedDan);
            }
            let n2 = Math.floor(Math.random() * 9) + 1; // 1..9

            currentProblem = {
                num1: n1,
                num2: n2,
                answer: n1 * n2
            };

            document.getElementById('problemText').innerText = `${n1} × ${n2} = ?`;
        }

        function startGame() {
            initAudio();
            score = 0;
            combo = 0;
            maxCombo = 0;
            correctAnswersCount = 0;
            timeLeft = 45;
            isGameRunning = true;

            // Update UI Counters
            document.getElementById('scoreText').innerText = `${score}점`;
            document.getElementById('comboText').innerText = combo;
            document.getElementById('timerText').innerText = `${timeLeft}s`;

            // Screen Switching
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('gameScreen').classList.add('flex');

            buildMoleGrid();
            generateNewProblem();

            // Main Timer
            gameTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('timerText').innerText = `${timeLeft}s`;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // Mole Spawning Loop
            spawnMolesLoop();
        }

        function spawnMolesLoop() {
            if (!isGameRunning) return;

            spawnMoleBatch();

            const nextInterval = DIFFICULTY_SETTINGS[selectedDifficulty].spawnInterval;
            moleTimer = setTimeout(spawnMolesLoop, nextInterval);
        }

        function spawnMoleBatch() {
            // Pick empty holes
            const emptyIndices = [];
            for (let i = 0; i < HOLE_COUNT; i++) {
                if (!activeMoles[i]) emptyIndices.push(i);
            }

            if (emptyIndices.length === 0) return;

            // Decide whether to force spawn the correct answer
            const correctExists = activeMoles.some(m => m && m.isCorrect);
            let countToSpawn = Math.min(emptyIndices.length, Math.floor(Math.random() * 2) + 1); // 1 or 2 moles

            for (let c = 0; c < countToSpawn; c++) {
                if (emptyIndices.length === 0) break;
                const holeIdx = emptyIndices.splice(Math.floor(Math.random() * emptyIndices.length), 1)[0];

                let value;
                let isCorrect = false;

                if (!correctExists && c === 0 && Math.random() < 0.75) {
                    // High chance to spawn correct answer if none present
                    value = currentProblem.answer;
                    isCorrect = true;
                } else {
                    // Generate distractor / wrong answer
                    if (Math.random() < 0.3) {
                        // Near wrong answer
                        const offset = (Math.random() < 0.5 ? 1 : -1) * (Math.floor(Math.random() * 3) + 1);
                        value = Math.max(1, currentProblem.answer + offset);
                    } else {
                        // Random multiplication result
                        value = (Math.floor(Math.random() * 8) + 2) * (Math.floor(Math.random() * 9) + 1);
                    }

                    if (value === currentProblem.answer) {
                        isCorrect = true;
                    }
                }

                popupMole(holeIdx, value, isCorrect);
            }
        }

        function popupMole(holeIdx, value, isCorrect) {
            const moleEl = document.getElementById(`mole-${holeIdx}`);
            const valEl = document.getElementById(`mole-val-${holeIdx}`);
            if (!moleEl || !valEl) return;

            valEl.innerText = value;
            moleEl.classList.add('up');
            playSound('pop');

            const upTime = DIFFICULTY_SETTINGS[selectedDifficulty].moleUpTime;

            const timeoutId = setTimeout(() => {
                hideMole(holeIdx);
            }, upTime);

            activeMoles[holeIdx] = {
                value: value,
                isCorrect: isCorrect,
                timeout: timeoutId
            };
        }

        function hideMole(holeIdx) {
            const moleEl = document.getElementById(`mole-${holeIdx}`);
            if (moleEl) moleEl.classList.remove('up', 'hit');

            if (activeMoles[holeIdx]) {
                clearTimeout(activeMoles[holeIdx].timeout);
                activeMoles[holeIdx] = null;
            }
        }

        /* ================= USER INTERACTION ================= */
        function whackMole(holeIdx, event) {
            if (!isGameRunning) return;
            const moleData = activeMoles[holeIdx];
            if (!moleData) return; // Empty hole hit

            const moleEl = document.getElementById(`mole-${holeIdx}`);
            moleEl.classList.add('hit');

            const clickX = event.clientX || (event.touches && event.touches[0].clientX) || 0;
            const clickY = event.clientY || (event.touches && event.touches[0].clientY) || 0;

            if (moleData.isCorrect) {
                // CORRECT HIT!
                playSound('hitCorrect');
                score += 10;
                combo++;
                correctAnswersCount++;
                if (combo > maxCombo) maxCombo = combo;

                showPopText(clickX, clickY, `+10 ${combo > 1 ? combo + '연속!' : '정답!'}`, 'text-emerald-500');

                // Clear mole & generate next problem
                hideMole(holeIdx);
                generateNewProblem();
            } else {
                // WRONG HIT!
                playSound('hitWrong');
                score = Math.max(0, score - 5);
                combo = 0;

                showPopText(clickX, clickY, '-5 땡!', 'text-rose-600');

                // Screen Shake effect
                const mainApp = document.getElementById('app');
                mainApp.classList.add('shake-screen');
                setTimeout(() => mainApp.classList.remove('shake-screen'), 400);

                hideMole(holeIdx);
            }

            // Update UI HUD
            document.getElementById('scoreText').innerText = `${score}점`;
            document.getElementById('comboText').innerText = combo;
        }

        function showPopText(x, y, text, colorClass) {
            const overlay = document.getElementById('popOverlay');
            const pop = document.createElement('div');
            pop.className = `absolute font-black text-2xl sm:text-3xl animate-pop-text pointer-events-none drop-shadow-md ${colorClass}`;
            pop.innerText = text;

            // Calculate relative position inside app box
            const rect = overlay.getBoundingClientRect();
            const posX = x - rect.left - 30;
            const posY = y - rect.top - 20;

            pop.style.left = `${Math.max(10, Math.min(rect.width - 80, posX))}px`;
            pop.style.top = `${Math.max(10, Math.min(rect.height - 40, posY))}px`;

            overlay.appendChild(pop);
            setTimeout(() => pop.remove(), 800);
        }

        /* ================= GAME OVER & RESET ================= */
        function endGame() {
            isGameRunning = false;
            clearInterval(gameTimer);
            clearTimeout(moleTimer);

            // Hide all active moles
            for (let i = 0; i < HOLE_COUNT; i++) {
                hideMole(i);
            }

            playSound('gameover');

            // Set Result Values
            document.getElementById('finalScore').innerText = `${score}점`;
            document.getElementById('correctCount').innerText = `${correctAnswersCount}개`;
            document.getElementById('maxCombo').innerText = `${maxCombo}회`;

            // Set evaluation badge based on score
            const badge = document.getElementById('resultBadge');
            if (score >= 250) {
                badge.innerText = '🏆 구구단 마스터!';
                badge.className = 'inline-block px-4 py-1 bg-amber-400 text-amber-950 rounded-full font-bold text-sm mb-2';
            } else if (score >= 120) {
                badge.innerText = '⭐ 훌륭해요!';
                badge.className = 'inline-block px-4 py-1 bg-emerald-200 text-emerald-900 rounded-full font-bold text-sm mb-2';
            } else {
                badge.innerText = '👍 조금 더 연습해봐요!';
                badge.className = 'inline-block px-4 py-1 bg-slate-200 text-slate-800 rounded-full font-bold text-sm mb-2';
            }

            // Switch Screen
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('flex');
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('gameOverScreen').classList.add('flex');
        }

        function showStartScreen() {
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('flex');
            document.getElementById('startScreen').classList.remove('hidden');
        }

        // Initialize buttons on page load
        window.onload = function() {
            initDanButtons();
            setDifficulty('medium');
        };
    </script>
</body>
</html>
